@if (isOpen) {
  <div
    class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
    (click)="onBackdropClick($event)"
  >
    <div
      class="modal-content w-full max-w-md rounded-xl border border-gray-700 bg-gray-800 p-6 shadow-2xl"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'modal-title'"
    >
      <div class="mb-4 flex items-center justify-between">
        <h2 id="modal-title" class="text-xl font-semibold text-white">
          {{ title }}
        </h2>
        <button
          (click)="onClose()"
          class="text-gray-400 transition-colors hover:text-white"
          aria-label="Cerrar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <ng-content></ng-content>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button
          (click)="onClose()"
          class="rounded-lg px-4 py-2 text-sm font-medium text-gray-300 transition-colors hover:bg-gray-700"
        >
          {{ cancelText }}
        </button>
        <button
          (click)="onConfirm()"
          [disabled]="confirmDisabled"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
